name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & upload APK
    runs-on: ubuntu-latest
    env:
      # 仓库已内置 keystore（keystore/cgfree-release.jks + keystore.properties），
      # 本地与 CI 所有构建签名一致，可直接覆盖安装。如配置以下 Secrets 可覆盖内置密钥：
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # debug 与 release 均使用仓库内置 keystore 签名（KEYSTORE_BASE64 配置时自动覆盖）
      - name: Build signed APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      # 只上传签名产物（app-release.apk）；若因配置问题产出 unsigned 包则直接失败，避免误传
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error